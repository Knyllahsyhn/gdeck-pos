name: Test und Deploy

on:
  push:
    # Die Zweige von Dependabot laufen ueber ihren Pull Request. Ein Lauf
    # aus dem Push heraus wuerde zusaetzlich die Vorschau hochladen, und
    # dafuer gibt GitHub die Cloudflare-Secrets an Dependabot nicht heraus.
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Der Lauf liest nur den Quelltext und schreibt in die Zusammenfassung.
# Veroeffentlicht wird ueber den Cloudflare-Token, nicht ueber GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Der QR-Leser wird gegen echte Bilder geprüft: qrencode schreibt sie,
      # zbarimg liest gegen, ImageMagick verdreht und verrauscht sie.
      # Ohne diese drei überspringt die Suite sich selbst, und dann wäre der
      # Leser in der CI überhaupt nicht abgedeckt.
      - name: Bildwerkzeuge
        # Haengt der Paketspiegel, soll der Schritt abbrechen statt den Lauf
        # stundenlang zu blockieren. Fehlen die Werkzeuge, ueberspringt sich
        # die QR-Suite selbst, und dann waere der Leser in der CI ungeprueft.
        timeout-minutes: 6
        run: |
          # Ohne diese Grenzen wartet apt auf einen stehenden Spiegel, bis der
          # Schritt abgewuergt wird. Mit ihnen gibt es auf und versucht es neu.
          opt="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          hol(){ sudo apt-get $opt update -qq && sudo apt-get $opt install -y -qq --no-install-recommends qrencode zbar-tools imagemagick; }
          hol || (sleep 15 && hol) || (sleep 30 && hol)

      # Baut public/ und fährt alle acht Suiten.
      - run: npm test

      # Nur von main aus veröffentlichen, Pull Requests bleiben ein Testlauf.
      # Ohne wranglerVersion greift die Action auf das wrangler zurück, das
      # npm ci schon installiert hat. Es gilt also die Fassung aus
      # package-lock.json und nicht das, was gerade als latest gilt.
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Jeder andere Branch bekommt eine Vorschau unter eigener Adresse.
      # Die nimmt keinen echten Verkehr an, die Kasse läuft weiter auf main.
      - name: Name für die Vorschau
        if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        id: alias
        run: |
          name=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-25)
          name=${name%-}
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Vorschau hochladen
        if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }}

      - name: Adresse der Vorschau
        if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "### Vorschau" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ steps.alias.outputs.name }}-gdeck-pos.knyl.workers.dev" >> "$GITHUB_STEP_SUMMARY"
