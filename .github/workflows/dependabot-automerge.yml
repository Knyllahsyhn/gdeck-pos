name: Dependabot automatisch mergen

# Schaltet fuer Pull Requests von Dependabot das Auto-Merge von GitHub ein.
# Gemergt wird erst, wenn der Check "build" aus deploy.yml gruen ist; das
# erzwingt das Ruleset auf main. Faellt die Suite durch, bleibt der Pull
# Request offen liegen.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # npm kommt laut dependabot.yml ohnehin nur mit Minor und Patch.
      # Major-Spruenge der Actions bleiben Handarbeit: wrangler-action laeuft
      # nur beim Deploy und wird im Pull Request gar nicht ausgefuehrt.
      - name: Auto-Merge einschalten
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
